# Test profile - use H2 in-memory (Flyway disabled; JPA creates schema)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
jwt.secret=test-secret-key-at-least-32-characters-long-for-hmac256
jwt.expiration-ms=900000
cms.card.encryption-optional=true
cms.card.encryption-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
