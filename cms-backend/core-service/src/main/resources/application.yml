# Card Management System - REST API
spring:
  application:
    name: card-management-system
  datasource:
    # CMS schema user — never rely on shared SPRING_DATASOURCE_* (barkatpay) without override
    url: "${CMS_DB_URL:jdbc:oracle:thin:@//167.233.72.195:1521/ORCLPDB1}"
    username: "${CMS_DB_USERNAME:CMS}"
    password: "${CMS_DB_PASSWORD:BarakatPay786}"
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Karachi
  flyway:
    enabled: false
    # false on empty/broken schema so V1 (BIZ_PROCESS) actually runs
    baseline-on-migrate: false

app:
  default-app-id: CMS
  date-format: "dd/MM/yyyy HH:mm:ss"
  cors:
    # Comma-separated browser origins. Docker / prod: set APP_CORS_ALLOWED_ORIGINS (include public UI URL, e.g. http://HOST:7071).
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:7071,http://127.0.0.1:7071}"

jwt:
  secret: "${CMS_JWT_SECRET:your-256-bit-secret-key-here-change-in-production-please-use-at-least-32-chars}"
  expiration-ms: 900000

cms:
  card:
    encryption-key: "${CARD_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    encryption-key-env: CARD_ENCRYPTION_KEY
    hash-salt: "${CMS_CARD_HASH_SALT:cms-pan-salt}"
    encryption-optional: true
    dummy-hsm: true
    mobile-default-limit-profile: "${CMS_MOBILE_DEFAULT_LIMIT_PROFILE:STD}"  # fallback if card type has no default limit
    export:
      output-dir: "./export"
      filename-pattern: "card_export_{date}_{requestId}.txt"
      include-pan: false
      format: BUREAU
      external-command: ""

logging:
  level:
    com.cms: INFO
    org.springframework.security: INFO

server:
  port: 8015
