# Card Management System - Main configuration
spring.application.name=card-management-system

# CMS Oracle schema (NOT barkatpay). Prefer CMS_DB_*; deploy must also set SPRING_DATASOURCE_* to these.
spring.datasource.url=${CMS_DB_URL:jdbc:oracle:thin:@//167.233.72.195:1521/ORCLPDB1}
spring.datasource.username=${CMS_DB_USERNAME:CMS}
spring.datasource.password=${CMS_DB_PASSWORD:BarakatPay786}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10


cleaspring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway - creates CMS tables on first start. baseline-on-migrate=false so V1 is not skipped.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

# Default APP_ID for login (optional); used by PasswordPolicyService when appId not passed
app.default-app-id=CMS

# CORS browser origins (comma-separated). Prod: APP_CORS_ALLOWED_ORIGINS env, e.g. http://YOUR_HOST:7071
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:7071,http://127.0.0.1:7071}

# Date format for display (ported from DateFormat in old config)
app.date-format=dd/MM/yyyy HH:mm:ss

# Persist/read timestamps in local business timezone to keep end-of-day values (23:59:59) stable.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Karachi

# JWT — 15 minutes (idle/session alignment with frontend)
jwt.secret=${CMS_JWT_SECRET:your-256-bit-secret-key-here-change-in-production-please-use-at-least-32-chars}
jwt.expiration-ms=${CMS_JWT_EXPIRATION_MS:900000}

# ELK / Logging (optional)
logging.level.com.cms=INFO
logging.level.org.springframework.security=INFO

# Card encryption (AES-256; override via CARD_ENCRYPTION_KEY / CMS_CARD_* in prod)
cms.card.encryption-key=${CARD_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
cms.card.encryption-key-env=CARD_ENCRYPTION_KEY
cms.card.hash-salt=${CMS_CARD_HASH_SALT:cms-pan-salt}
cms.card.encryption-optional=true

# Card Export (Added on 31/3 for Export file) (Generated to Cardmanament->export folder)
cms.card.export.output-dir=./export
cms.card.export.format=BUREAU
cms.card.export.include-pan=false
# Fallback limit profile when card type has no DEFAULT_LIMIT_PROFILE_ID (approve/generate).
# Prefer configuring Housekeeping → Card types → Default limit profile.
cms.card.mobile-default-limit-profile=${CMS_MOBILE_DEFAULT_LIMIT_PROFILE:STD}

# Server
server.port=8015
