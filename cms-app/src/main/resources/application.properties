spring.application.name=cms-app
server.port=8016

# Read via cms.datasource.* (see DataSourceConfig), NOT spring.datasource.*: the container
# is started with the shared platform env-file, whose SPRING_DATASOURCE_* would otherwise
# override these and point CMS at the "barkatpay" schema. CMS_SPRING_DATASOURCE_* is also
# CMS-specific on purpose -- CMS_DB_* is already taken by cms-backend (a different DB).
cms.datasource.url=${CMS_SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//167.233.72.195:1521/ORCLPDB1}
cms.datasource.username=${CMS_SPRING_DATASOURCE_USERNAME:CMS}
cms.datasource.password=${CMS_SPRING_DATASOURCE_PASSWORD:BarakatPay786}
cms.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Karachi

spring.main.allow-circular-references=true

logging.level.com.cms.app=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT for mobile / LasPay app APIs (change secret in every environment).
cms.app.jwt.secret=${CMS_APP_JWT_SECRET:cms-app-mobile-jwt-secret-change-me-32chars-min}
cms.app.jwt.expiration-ms=${CMS_APP_JWT_EXPIRATION_MS:86400000}

# Comma-separated raw API keys accepted in addition to CMS_API_KEY table (UAT bootstrap).
cms.app.api-keys=${CMS_APP_API_KEYS:}

# Browser CORS allowlist (comma-separated exact origins). Empty = no browser Origin allowed.
cms.app.cors.allowed-origins=${CMS_APP_CORS_ALLOWED_ORIGINS:}

# Forgot-PIN otpProof: when secret is set, require signed payload.signature from LasPay after OTP.
# When empty, any non-blank otpRef (min length) is accepted (UAT only).
cms.app.otp-proof.secret=${CMS_APP_OTP_PROOF_SECRET:}
cms.app.otp-proof.min-opaque-length=${CMS_APP_OTP_PROOF_MIN_LENGTH:8}
cms.app.otp-proof.max-skew-seconds=${CMS_APP_OTP_PROOF_MAX_SKEW_SECONDS:300}

# Same key/salt as cms-backend — decrypt PAN/CVV + panHash lookup for virtual cards.
cms.card.encryption-key=${CARD_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
cms.card.encryption-key-env=CARD_ENCRYPTION_KEY
cms.card.hash-salt=${CMS_CARD_HASH_SALT:cms-pan-salt}
cms.card.encryption-optional=true

# APS PIN-block keys are not stored here.
# Copy application-local.properties.example to application-local.properties and fill it.
# That file is gitignored. Default side is issuer (awk.isr).
network.key.pinblock.side=${NETWORK_KEY_PINBLOCK_SIDE:issuer}
spring.config.import=optional:classpath:application-local.properties
