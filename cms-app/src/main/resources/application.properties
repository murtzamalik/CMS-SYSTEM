spring.application.name=cms-app
server.port=8016

# Read via cms.datasource.* (see DataSourceConfig), NOT spring.datasource.*: the container
# is started with the shared platform env-file, whose SPRING_DATASOURCE_* would otherwise
# override these and point CMS at the "barkatpay" schema. CMS_SPRING_DATASOURCE_* is also
# CMS-specific on purpose -- CMS_DB_* is already taken by cms-backend (a different DB).
cms.datasource.url=${CMS_SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//167.233.72.195:1521/ORCLPDB1}
cms.datasource.username=${CMS_SPRING_DATASOURCE_USERNAME:CMS}
cms.datasource.password=${CMS_SPRING_DATASOURCE_PASSWORD:BarakatPay786}
cms.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Karachi

spring.main.allow-circular-references=true

logging.level.com.cms.app=INFO
logging.level.org.hibernate.SQL=DEBUG
