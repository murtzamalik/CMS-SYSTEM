# Optional: use when serving the static `out/` folder instead of `next start`.
# Example: nginx -c /path/to/nginx.conf
#
# Security headers mirror next.config.js so ZAP findings stay cleared.

server {
    listen 7071;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA / static-export fallback
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Hide nginx version
    server_tokens off;

    # Enable only after TLS is terminated in front of this server:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
